[project]
name = "csakernel"
version = "0.1.0"
description = "Recording rules for auditable systems analysis: evidence ledger, inheritance, absence census, evolution log"
requires-python = ">=3.10"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
